name: Thicket
options:
  bundleIdPrefix: studio.slowbrewed.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SBAppPortfolio:
    path: ..

targets:
  Thicket:
    type: application
    platform: iOS
    sources:
      - path: Thicket/Sources
    dependencies:
      - package: SBAppPortfolio
        product: SBAppPortfolio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.slowbrewed.example.thicket
        PRODUCT_NAME: Thicket
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thicket
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Thicket:
    build:
      targets:
        Thicket: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
